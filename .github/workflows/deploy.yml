name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package app
        run: zip -r deploy.zip package.json package-lock.json server public views

      - name: Upload bundle
        run: aws s3 cp deploy.zip "s3://elasticbeanstalk-us-east-2-672469410753/duelist-github-actions/${GITHUB_SHA}.zip"

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name DueList \
            --version-label "gh-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" \
            --source-bundle S3Bucket=elasticbeanstalk-us-east-2-672469410753,S3Key=duelist-github-actions/${GITHUB_SHA}.zip

      - name: Deploy version
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name duelist-env \
            --version-label "gh-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
