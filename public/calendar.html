<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar · DueList</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>

    <main class="main">
      <div class="page-header">
        <div>
          <h1>Calendar</h1>
          <p class="sub">Dots mark due dates, colored by class. Click a day to see what's due.</p>
        </div>
        <button class="btn btn-secondary" id="jump-today">Today</button>
      </div>

      <div class="cal-layout">
        <div class="card">
          <div class="cal-head">
            <h3 id="month-label"></h3>
            <div class="cal-nav">
              <button class="btn btn-secondary btn-icon" id="prev-month" title="Previous month"></button>
              <button class="btn btn-secondary btn-icon" id="next-month" title="Next month"></button>
            </div>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="legend" id="legend"></div>
        </div>

        <div class="card day-panel">
          <div class="day-nav">
            <button class="btn btn-secondary btn-icon" id="prev-day" title="Previous day"></button>
            <div style="text-align:center">
              <h3 id="day-label"></h3>
              <div class="sub" id="day-sub"></div>
            </div>
            <button class="btn btn-secondary btn-icon" id="next-day" title="Next day"></button>
          </div>
          <div class="a-list" id="day-list"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
