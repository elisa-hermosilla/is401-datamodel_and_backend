<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="See upcoming, overdue, and completed assignments in your DueList dashboard.">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard · DueList</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app overview-app">
    <aside id="sidebar"></aside>
    <main class="main overview-main dashboard-main">
      <header class="page-header">
        <div><h1 id="greeting">Dashboard</h1><p class="sub" id="today-line"></p></div>
        <div class="toolbar">
          <a class="btn btn-secondary btn-sm" href="calendar.html">View calendar</a>
          <button class="btn btn-primary btn-sm" id="add-assignment">Add assignment</button>
        </div>
      </header>

      <div class="stat-grid overview-stats" id="stat-grid" aria-label="Filter assignments by due date"></div>

      <div class="dashboard-layout">
        <section class="card queue-panel" aria-labelledby="queue-heading">
          <div class="card-header">
            <div class="queue-heading"><h2 id="queue-heading">Assignments</h2><button class="text-button" id="all-open" aria-pressed="true">All open</button></div>
            <label class="check-label"><input type="checkbox" id="show-done"> Include completed</label>
          </div>
          <div class="queue-controls">
            <input class="input" id="assignment-search" type="search" aria-label="Search assignments" placeholder="Search assignments…">
            <select class="select" id="f-class" aria-label="Filter by class"></select>
            <select class="select" id="f-type" aria-label="Filter by assignment type"></select>
            <select class="select" id="sort" aria-label="Sort assignments">
              <option value="due">Due date</option><option value="class">Class</option>
              <option value="type">Type</option><option value="custom">Custom order</option>
            </select>
          </div>
          <div class="queue-context"><span id="queue-scope">All open assignments</span><div class="active-filters" id="active-filters"></div></div>
          <div class="compact-list" id="assignment-list"></div>
          <div class="list-footer">
            <span id="filter-count" role="status"></span>
            <div class="pager"><button class="btn btn-secondary btn-sm" id="queue-prev" aria-label="Previous assignments">Previous</button><span id="queue-page"></span><button class="btn btn-secondary btn-sm" id="queue-next" aria-label="Next assignments">Next</button></div>
          </div>
        </section>

        <aside class="dashboard-rail" aria-label="Planning overview">
          <section class="card focus-card" id="next-grid" aria-label="Next deadline"></section>
          <section class="card week-card" aria-labelledby="week-heading">
            <div class="card-header"><h2 id="week-heading">Next 7 days</h2><a class="subtle-link" href="calendar.html">Calendar ↗</a></div>
            <div class="week-strip" id="week-strip"></div>
            <p class="workload-summary" id="week-summary"></p>
            <div class="week-progress" id="week-progress"></div>
          </section>
        </aside>
      </div>
    </main>
  </div>
  <script src="js/api.js"></script><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/dashboard.js"></script>
</body>
</html>
