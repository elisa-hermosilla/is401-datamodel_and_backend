<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · DueList</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>

    <main class="main is-loading">
      <div class="page-header">
        <div>
          <h1 id="greeting">Dashboard</h1>
          <p class="sub" id="today-line"></p>
        </div>
        <a class="btn btn-secondary" href="assignments.html">View classes</a>
      </div>

      <!-- Due-window widgets -->
      <div class="stat-grid" id="stat-grid"></div>

      <!-- Work on this next + completed progress -->
      <div class="next-grid" id="next-grid"></div>

      <!-- Streaks -->
      <div class="streak-grid" id="streak-grid"></div>

      <!-- Upcoming list -->
      <div class="card">
        <div class="card-header">
          <div>
            <h3>Up next</h3>
            <p class="sub">Pick a sort, choose Custom to drag rows into your own order, or click a class or type tag to filter.</p>
          </div>
          <div class="toolbar">
            <button type="button" class="btn btn-ghost btn-sm" id="reset-order" hidden title="Clear your custom order">Reset order</button>
            <label style="font-size:13px;color:var(--muted)">Sort by</label>
            <select class="select" id="sort" style="width:auto">
              <option value="due">Due date</option>
              <option value="class">Class</option>
              <option value="type">Assignment type</option>
              <option value="custom">Custom (drag)</option>
            </select>
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:8px">
              <input type="checkbox" id="show-done"> Show completed
            </label>
          </div>
        </div>
        <div class="filter-bar">
          <span class="label">Filter</span>
          <select class="select" id="f-class"></select>
          <select class="select" id="f-type"></select>
          <div class="active-filters" id="active-filters"></div>
          <span class="filter-count" id="filter-count"></span>
        </div>
        <div class="search-bar">
          <span class="search-icon" id="search-icon" aria-hidden="true"></span>
          <input class="input" type="search" id="search" placeholder="Search by name, class, submission, or type" autocomplete="off" spellcheck="false" aria-label="Search assignments">
          <button type="button" class="btn btn-ghost btn-icon" id="search-clear" title="Clear search (Esc)" aria-label="Clear search" style="display:none"></button>
          <span class="search-hint">Press / to search</span>
        </div>
        <div class="a-list" id="assignment-list"></div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
